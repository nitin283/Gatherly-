<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${event.title} + ' — Gatherly'">Event Details — Gatherly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container event-details-page">
    <div class="event-banner" style="height:220px; border-radius:10px; margin-top:20px;"></div>

    <div class="event-details-copy">
    <span class="pill pill-approved" style="margin-top:16px; display:inline-block;" th:text="${event.category}">Category</span>
    <h1 th:text="${event.title}">Event Title</h1>
    <p class="card-meta">
        📅 <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy, hh:mm a')}">Date</span>
        &nbsp;•&nbsp; 📍 <span th:text="${event.venue}">Venue</span>
    </p>
    <p th:text="${event.description}">Description</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <h3>Select Tickets</h3>

    <div th:if="${#lists.isEmpty(ticketTypes)}" class="empty-state">
        No ticket types are available for this event yet.
    </div>

    <div sec:authorize="!isAuthenticated()" th:if="${!#lists.isEmpty(ticketTypes)}" class="alert alert-error">
        Please <a th:href="@{/login}">log in</a> as an attendee to book tickets.
    </div>

    <form th:if="${!#lists.isEmpty(ticketTypes)}"
          sec:authorize="hasRole('ATTENDEE')"
          th:action="@{/events/{id}/book(id=${event.id})}" th:object="${bookingRequest}" method="post">
        <div class="ticket-table-scroll">
        <table class="ticket-table">
            <thead>
                <tr><th>Type</th><th>Price</th><th>Available</th><th>Quantity</th></tr>
            </thead>
            <tbody>
                <tr th:each="tt, stat : ${ticketTypes}">
                    <td th:text="${tt.typeName}">General</td>
                    <td th:text="'₹' + ${tt.price}">₹499</td>
                    <td th:text="${tt.availableQuantity}">120</td>
                    <td>
                        <input type="hidden" th:field="*{selections[__${stat.index}__].ticketTypeId}">
                        <input type="number" min="0" th:max="${tt.availableQuantity}"
                               th:field="*{selections[__${stat.index}__].quantity}"
                               style="width:70px; padding:6px;">
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <button type="submit" class="btn btn-primary">Book Now</button>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
