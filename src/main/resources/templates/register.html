<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up — Gatherly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Registration form is bound to RegisterRequest and displays field validation errors. -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="form-wrapper">
    <h2>Create your account</h2>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Jane Doe">
            <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="you@example.com">
            <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="At least 6 characters">
            <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="form-group">
            <label for="role">I am a...</label>
            <select id="role" th:field="*{role}">
                <option value="ATTENDEE">Attendee — I want to book events</option>
                <option value="ORGANIZER">Organizer — I want to host events</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign Up</button>
    </form>

    <p class="form-footer-link">
        Already have an account? <a th:href="@{/login}">Log in</a>
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
