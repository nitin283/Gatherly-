<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Gatherly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="form-wrapper">
    <h2>Welcome back</h2>

    <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
        <div th:if="${param.disabled}" class="alert alert-error">Your account has been disabled. Contact an administrator.</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created! Please log in.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="username" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Log In</button>
    </form>

    <p class="form-footer-link">
        Don't have an account? <a th:href="@{/register}">Sign up</a>
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
