<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Event — Gatherly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- New event form; CreateEventRequest validates event details and the initial ticket type. -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="form-wrapper" style="max-width:520px;">
    <h2>Create Event</h2>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/dashboard/organizer/events}" th:object="${createEventRequest}" method="post">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}">
            <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="3"></textarea>
            <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" th:field="*{category}" placeholder="Music, Tech, Sports...">
            <div class="form-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>
        <div class="form-group">
            <label for="venue">Venue</label>
            <input type="text" id="venue" th:field="*{venue}">
            <div class="form-error" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}"></div>
        </div>
        <div class="form-group">
            <label for="eventDate">Date &amp; Time</label>
            <input type="datetime-local" id="eventDate" th:field="*{eventDate}">
            <div class="form-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
        </div>

        <hr>
        <p><strong>Add your first ticket type</strong> (you can add more later)</p>

        <div class="form-group">
            <label for="ticketTypeName">Ticket Type</label>
            <select id="ticketTypeName" th:field="*{ticketTypeName}">
                <option value="GENERAL">General</option>
                <option value="PREMIUM">Premium</option>
                <option value="VIP">VIP</option>
            </select>
        </div>
        <div class="form-group">
            <label for="price">Price (₹)</label>
            <input type="number" step="0.01" min="0" id="price" th:field="*{price}">
            <div class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity Available</label>
            <input type="number" min="1" id="quantity" th:field="*{quantity}">
            <div class="form-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%">Submit for Approval</button>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
