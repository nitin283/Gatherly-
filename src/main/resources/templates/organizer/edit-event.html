<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Event — Gatherly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="form-wrapper" style="max-width:520px;">
    <h2>Edit Event</h2>
    <p class="card-meta">Editing sends this event back for admin approval.</p>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/dashboard/organizer/events/{id}/edit(id=${event.id})}" th:object="${event}" method="post">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" th:field="*{category}">
        </div>
        <div class="form-group">
            <label for="venue">Venue</label>
            <input type="text" id="venue" th:field="*{venue}">
        </div>
        <div class="form-group">
            <label for="eventDate">Date &amp; Time</label>
            <input type="datetime-local" id="eventDate" th:field="*{eventDate}">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Save Changes</button>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
