<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Events — Gatherly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="dashboard-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h1>My Events</h1>
        <a th:href="@{/dashboard/organizer/events/new}" class="btn btn-primary">+ Create Event</a>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="empty-state">
        You haven't created any events yet. Click "Create Event" to get started.
    </div>

    <table th:if="${!#lists.isEmpty(events)}">
        <thead>
            <tr><th>Title</th><th>Date</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.title}">Title</td>
                <td th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}">Date</td>
                <td>
                    <span th:if="${event.status.name() == 'PENDING'}" class="pill pill-pending">Pending</span>
                    <span th:if="${event.status.name() == 'APPROVED'}" class="pill pill-approved">Approved</span>
                    <span th:if="${event.status.name() == 'REJECTED'}" class="pill pill-rejected">Rejected</span>
                </td>
                <td>
                    <a th:href="@{/dashboard/organizer/events/{id}(id=${event.id})}" class="btn btn-outline btn-sm">Manage</a>
                    <a th:href="@{/dashboard/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-outline btn-sm">Edit</a>
                    <a th:href="@{/dashboard/organizer/events/{id}/delete(id=${event.id})}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
