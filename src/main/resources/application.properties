# ---------- Application ----------
spring.application.name=gatherly

# Load application-local.properties (your private DB credentials)
spring.profiles.active=local

# ---------- Database connection ----------
spring.datasource.url=jdbc:mysql://localhost:3306/gatherly_db?useSSL=false&allowPublicKeyRetrieval=true

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false